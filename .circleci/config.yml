version: 2.1

# CI for the Dark compiler.
#
# The devcontainer image in Dockerfile is the source of truth for the
# pinned OCaml toolchain and native dependencies. CI builds that image and runs the
# full test suite inside it, so CI and local dev match exactly.

jobs:
  build-and-test:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build devcontainer image
          command: docker build -t dark-compiler-ci .
      - run:
          name: Start container
          command: |
            docker run -d --name dark-ci \
              -v "$PWD":/workspace \
              -w /workspace \
              dark-compiler-ci \
              tail -f /dev/null
      - run:
          name: Fix workspace ownership
          command: docker exec -u root dark-ci chown -R agent:agent /workspace
      - run:
          name: Build (debug)
          command: docker exec dark-ci ./build --ai
      - run:
          name: Check porting framework consistency (not behavior)
          command: docker exec dark-ci bash scripts/check-porting
      - run:
          name: Prepare the stdlib cache
          command: docker exec dark-ci bash -c 'cd /tmp && /workspace/_build/default/bin/dark.exe -q -e "1L" -o /tmp/warm'
          no_output_timeout: 15m
      - run:
          name: Run native regression checks
          command: docker exec dark-ci dune runtest
          no_output_timeout: 15m
      - run:
          name: Run test suite
          command: docker exec dark-ci ./run-tests --ai
          no_output_timeout: 15m

  # A static musl darkc for one architecture, built by tools/static/build.
  static-darkc:
    parameters:
      resource_class:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>
    steps:
      - checkout
      - run:
          name: Build the static darkc
          command: |
            mkdir -p release
            tools/static/build "release/darkc-linux-$(uname -m)"
          no_output_timeout: 30m
      - run:
          name: Check it runs on another distro
          command: |
            docker run --rm -v "$PWD/release:/r:ro" debian:12 /r/darkc-linux-$(uname -m) --version
      - persist_to_workspace:
          root: release
          paths:
            - darkc-linux-*

  # Attach the binaries and their sha256 sums to a release named after the commit.
  # gh comes with the machine image and reads GITHUB_TOKEN from the github-release context.
  release-darkc:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - attach_workspace:
          at: release
      - run:
          name: Publish the release
          command: |
            cd release
            sha256sum darkc-linux-* > SHA256SUMS
            cat SHA256SUMS
            tag="darkc-${CIRCLE_SHA1:0:9}"
            gh release create "$tag" darkc-linux-* SHA256SUMS \
              --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --target "$CIRCLE_SHA1" --title "$tag" \
              --notes "darkc built from $CIRCLE_SHA1"

workflows:
  version: 2
  ci:
    jobs:
      - build-and-test
      - static-darkc:
          matrix:
            parameters:
              resource_class: [large, arm.large]
          filters:
            branches:
              only: main
      - release-darkc:
          context: github-release
          requires:
            - static-darkc
          filters:
            branches:
              only: main
